
<div class="well news-sidebar">
    <h4 class="smallcaps">News</h4>

    {% assign sorted_articles = site.news | sort: 'date' | reverse %}
    <ul class="no-bullet news-sidebar-list">
    {% for article in sorted_articles limit: 6 %}

        <li class="news-sidebar-item">
            {% if article.image %}
            <a href="{{ article.url | relative_url }}" class="news-sidebar-image-link">
                <img
                    class="news-sidebar-image"
                    src="{{ '/assets/images/news/' | append: article.image | relative_url }}"
                    alt="{{ article.image_alt | default: article.title | escape }}"
                    loading="lazy"
                    decoding="async"
                />
            </a>
            {% endif %}
            <time class="news-sidebar-date" datetime="{{ article.date | date_to_xmlschema }}">{{ article.date | date: "%B %d, %Y" }}</time>
            <div class="news-sidebar-title">{{ article.title }}</div>
            <a class="btn-home news-sidebar-more" href="{{ article.url | relative_url }}">
                <span class="glyphicon glyphicon-info-sign" aria-hidden="true"></span>
                Read more
            </a>
        </li>
    {% endfor %}
    </ul>
    
        <h4 class="news-sidebar-all">
            <a href="{{ '/allnews/' | relative_url }}">See all news...</a>
        </h4>
</div>
<script src="{{ '/js/news.js' | relative_url }}" defer></script>
